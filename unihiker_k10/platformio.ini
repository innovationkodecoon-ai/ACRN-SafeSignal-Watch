; PlatformIO project for the SafeSignal K10 watch.
; Open the "unihiker_k10" folder in VS Code (PlatformIO), then Upload.
; The .ino is compiled directly (PlatformIO converts it), so no copy to src/main.cpp is needed.

[platformio]
src_dir = safesignal_k10

[env:unihiker_k10]
platform  = espressif32
framework = arduino
board     = esp32-s3-devkitc-1          ; K10 is an ESP32-S3; change if you have a K10-specific board definition

; ---- the COM port of your K10 ----
upload_port  = COM7
monitor_port = COM7
monitor_speed = 115200
upload_speed  = 460800

; ESP32-S3 with PSRAM (needed for the camera frames)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1

; The UNIHIKER K10 library (unihiker_k10.h) must be available to PlatformIO. If the build says
; "unihiker_k10.h: No such file", download DFRobot's K10 Arduino library (the one installed by the
; UNIHIKER board package) into  unihiker_k10/lib/  or add its GitHub URL below:
; lib_deps =
;   https://github.com/<DFRobot K10 library repo>
